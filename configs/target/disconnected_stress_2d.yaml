name: disconnected_stress_2d
dim: 200
has_entropy: False

mu: 1e3

fn:
  _target_: komino.distributions.constrained.disconnected_stresstest.DisconnectedStress
  dim: ${target.dim}
  n_eq: ${eval:'${target.dim} - 3'}
  n_ineq: 5
  n_components: 5

nhr:
  n_down: 500
  max_step: 245.0
  max_ls_iters: 2
  mu_slack: 1e3

olla:
  step_size: 5.e-4
  alpha: 2000.00
  n_hutch_samples: 0

soft_scmc:
  steps_per_level: 500
  ess_target: 0.25
  mu_min: 0.008

knn_nhr:
  knn_k: 20
  knn_tau: 0.3
  n_inner: 20
  mu_slack: ${eval:'${target.mu}/${target.dim}'}

knn_olla:
  knn_k: 20
  knn_tau: 0.3
  n_inner: 20
  max_step: 1.e3
  mu_slack: ${eval:'${target.mu}/${target.dim}'}

cluster_nhr:
  cluster_threshold: 1.56
  n_inner: 10
  mu_slack: 1e3
