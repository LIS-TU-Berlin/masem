name: uniform_ball2_connected
dim: 3

fn:
  _target_: komino.distributions.constrained.uniform_ball2.UniformBall2
  dim: ${target.dim}

# algorithm-specific hyperparams
nhr:
  n_down: 500
  max_step: 0.1
  max_ls_iters: 4
  mu_slack: 1.e3

olla:
  step_size: 8.e-4
  alpha: 2.e3
  n_hutch_samples: 4

soft_scmc:
  steps_per_level: 5
  ess_target: 0.75
  mu_min: 0.0017

knn_nhr:
  knn_k: 4
  knn_tau: 1.0
  n_inner: 50
  mu_slack: 1e3

knn_olla:
  knn_k: 4
  knn_tau: 1.0
  n_inner: 50
  max_step: null
  mu_slack: 1e3

cluster_nhr:
  cluster_threshold: 0.068
  n_inner: 100
  mu_slack: 1e3
