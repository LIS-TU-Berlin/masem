name: knn_nhr

fn:
  _target_: komino.samplers.knn_nhr.KnnNhr
  n_chains: ${eval_samples}
  n_down: ${target.nhr.n_down}
  max_ls_iters: ${target.nhr.max_ls_iters}
  mu_slack: ${target.knn_nhr.mu_slack}
  slack_margin: 1e-3
  max_step: ${target.nhr.max_step}

  knn_k: ${target.knn_nhr.knn_k}
  knn_tau: ${target.knn_nhr.knn_tau}
  n_inner: ${target.knn_nhr.n_inner}

n_iter: ${n_iter}
