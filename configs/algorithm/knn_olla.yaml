name: knn_olla

fn:
  _target_: komino.samplers.knn_olla.KnnOlla
  n_chains: ${eval_samples}
  n_down: ${target.nhr.n_down}
  alpha: ${target.olla.alpha}
  step_size: ${target.olla.step_size}
  n_hutch_samples: ${target.olla.n_hutch_samples}

  knn_k: ${target.knn_olla.knn_k}
  knn_tau: ${target.knn_olla.knn_tau}
  n_inner: ${target.knn_olla.n_inner}
  max_step: ${target.knn_olla.max_step}
  mu_slack: ${target.knn_olla.mu_slack}

n_iter: ${n_iter}
